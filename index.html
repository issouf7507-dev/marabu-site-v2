<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d454c" />

    <!--
      seo-fallback:start
      Métadonnées de repli, valeurs de l'accueil. Elles servent aux routes NON
      prérendues (articles de blog, dont les URLs viennent d'une API et ne sont
      pas connues au build) : Nginx leur sert ce fichier via le fallback SPA.
      scripts/prerender.mjs retire ce bloc des pages prérendues, où le composant
      Seo pose déjà les bonnes valeurs — deux <title> ou deux canonical
      concurrents sur une même page brouillent l'indexation.
      Ne pas retirer les marqueurs de commentaire.
    -->
    <title>Marabu — Conseils, Services & Intermédiations</title>
    <meta
      name="description"
      content="Marabu accompagne les organisations en Afrique de l'Ouest : conseil stratégique, services opérationnels et intermédiation d'affaires."
    />
    <link rel="canonical" href="https://v2.marabu.services/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marabu " />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://v2.marabu.services/" />
    <meta
      property="og:title"
      content="Marabu — Conseils, Services & Intermédiations"
    />
    <meta
      property="og:description"
      content="Marabu accompagne les organisations en Afrique de l'Ouest : conseil stratégique, services opérationnels et intermédiation d'affaires."
    />
    <meta
      property="og:image"
      content="https://v2.marabu.services/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Marabu — Conseils, Services & Intermédiations"
    />
    <meta
      name="twitter:description"
      content="Marabu accompagne les organisations en Afrique de l'Ouest : conseil stratégique, services opérationnels et intermédiation d'affaires."
    />
    <meta
      name="twitter:image"
      content="https://v2.marabu.services/og-image.jpg"
    />
    <!-- seo-fallback:end -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Marabu",
        "url": "https://v2.marabu.services",
        "sameAs": ["https://www.linkedin.com/in/marabu-services-3703992b0"],
        "email": "contact@marabu.services",
        "telephone": "+225 07 20 77 70 00",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Abidjan",
          "addressCountry": "CI"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
